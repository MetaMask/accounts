name: Build Speculos Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Speculos version to build'
        required: true
        default: '0.25.13'
  push:
    tags:
      - 'speculos-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          # Precedence: dispatch input → pushed tag name → default.
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${TAG_VERSION}" == speculos-v* ]]; then
            VERSION="${TAG_VERSION#speculos-v}"
          else
            VERSION="0.25.13"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid Speculos version '${VERSION}': expected MAJOR.MINOR.PATCH (e.g. 0.25.13)"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned for reproducible builds; keep in sync with
          # packages/speculos-up/scripts/build-speculos*.sh.
          pip install pyinstaller==6.14.1

      - name: Install speculos
        env:
          SPECULOS_VERSION: ${{ steps.version.outputs.version }}
        run: pip install "speculos==${SPECULOS_VERSION}"

      - name: Build standalone binary
        run: |
          mkdir -p dist
          pyinstaller \
            --onefile \
            --name speculos \
            --distpath dist \
            --workpath build \
            --noupx \
            --collect-all speculos \
            "$(python -c 'import speculos; print(speculos.__file__)')"

      - name: Verify binary architecture
        run: |
          file dist/speculos | tee /tmp/speculos-file.txt
          grep -Fq 'ELF' /tmp/speculos-file.txt
          grep -Fq 'x86-64' /tmp/speculos-file.txt

      - name: Package archive
        env:
          SPECULOS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          tar -czf "speculos-v${SPECULOS_VERSION}-linux-amd64.tar.gz" speculos

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speculos-linux-amd64
          path: dist/speculos-v*-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: speculos-linux-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECULOS_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: speculos-v${{ needs.build.outputs.version }}
        run: |
          gh release view "${RELEASE_TAG}" \
            || gh release create "${RELEASE_TAG}" \
                 --title "Speculos ${SPECULOS_VERSION}" \
                 --notes "Speculos binary release ${SPECULOS_VERSION}."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: speculos-v${{ needs.build.outputs.version }}
        run: gh release upload "${RELEASE_TAG}" dist/*.tar.gz --clobber
