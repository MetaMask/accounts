name: Build Speculos Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Speculos version to build'
        required: true
        default: '0.25.13'
  push:
    tags:
      - 'speculos-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          # Precedence: dispatch input → pushed tag name → default.
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${TAG_VERSION}" == speculos-v* ]]; then
            VERSION="${TAG_VERSION#speculos-v}"
          else
            VERSION="0.25.13"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid Speculos version '${VERSION}': expected MAJOR.MINOR.PATCH (e.g. 0.25.13)"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned for reproducible builds; keep in sync with
          # packages/speculos-up/scripts/build-speculos*.sh.
          pip install pyinstaller==6.14.1

      - name: Install speculos
        env:
          SPECULOS_VERSION: ${{ steps.version.outputs.version }}
        run: pip install "speculos==${SPECULOS_VERSION}"

      - name: Build standalone binary
        run: |
          mkdir -p dist
          pyinstaller \
            --onefile \
            --name speculos \
            --distpath dist \
            --workpath build \
            --noupx \
            --collect-all speculos \
            "$(python -c 'import speculos; print(speculos.__file__)')"

      - name: Verify binary architecture
        run: |
          file dist/speculos | tee /tmp/speculos-file.txt
          grep -Fq 'ELF' /tmp/speculos-file.txt
          grep -Fq 'x86-64' /tmp/speculos-file.txt

      - name: Package archive
        env:
          SPECULOS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          tar -czf "speculos-v${SPECULOS_VERSION}-linux-amd64.tar.gz" speculos

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: speculos-linux-amd64
          path: dist/speculos-v*-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: speculos-linux-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: speculos-v${{ needs.build.outputs.version }}
          files: dist/*.tar.gz
